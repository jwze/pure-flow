[package]
name = "pureflow-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
pureflow-core.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.3"
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWInterface", "CWWiFiClient"] }
