# PureFlow watermark: jvz | Original author of PureFlow; see LICENSE.
[package]
name = "pureflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "pureflow"

[[bin]]
name = "pureflow"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "pureflow-collector"
path = "src/bin/pureflow-collector.rs"
required-features = ["windows-collector"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
sha2 = { version = "0.10", optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
pureflow-core.workspace = true
pureflow-collector.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc = { version = "3.5", features = ["termination"], optional = true }
pureflow-storage = { path = "../../../crates/pureflow-storage", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }
sha2 = "0.10"

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
semver = { version = "1", optional = true }
url = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSGeometry", "NSAttributedString", "NSObject"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWindow", "NSResponder", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSGraphicsContext", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSStringDrawing", "NSColor", "NSBezierPath", "objc2-core-foundation"], optional = true }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager"], optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:sha2", "dep:ctrlc", "dep:pureflow-storage", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:tauri-plugin-opener", "dep:rfd", "dep:reqwest", "dep:semver", "dep:url", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-core-location"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
windows-collector = []
